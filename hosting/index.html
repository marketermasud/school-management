<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e1a31">
<title>Parkhidirpur High School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600&family=Noto+Serif+Bengali:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div id="splash" class="splash"><div class="sp-mark"><svg class="sp-ring" viewBox="0 0 120 120"><circle cx="60" cy="60" r="54"/><circle class="arc" cx="60" cy="60" r="54"/></svg><div class="sp-logo" id="spLogo"></div></div><div class="sp-name" id="spName">Parkhidirpur High School</div><div class="sp-text">লোড হচ্ছে…</div></div>
<script>try{var b=JSON.parse(localStorage.getItem('sms_brand')||'null');if(b){if(b.name)document.getElementById('spName').textContent=b.name;var l=document.getElementById('spLogo');if(b.logo){var i=new Image();i.src=b.logo;l.appendChild(i)}else if(b.name){l.textContent=b.name.charAt(0)}}}catch(e){}</script>
<script src="assets/app.js"></script>
</body>
</html>
